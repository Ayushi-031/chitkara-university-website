  <div class="carousel">
    <div class="carousel-track">
      <img src="m1.jpg" alt="Ambience 1">
      <img src="m2.jpg" alt="Ambience 2">
      <img src="m3.jpg" alt="Ambience 3">
      <img src="m4.jpg" alt="Ambience 4">
    </div>
  </div>
  <style>
    .carousel {
      width: 100%;
      height: 300px;
      overflow: hidden;
      position: relative;
    }
    .carousel-track {
      display: flex;
      animation: scroll 12s linear infinite;
    }
    .carousel img {
      width: 100%;
      object-fit: cover;
      flex-shrink: 0;
    }
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
  </style>
